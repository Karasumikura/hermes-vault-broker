name: hermes-vault-broker
version: 0.1.0
description: "Fill saved logins from an out-of-process credential broker. The broker runs as its own user, keeps its random data key (DEK) in checked mlock'd memory, and writes the password into the page itself over a DevTools endpoint read from its own root-owned loopback config (never from the model). The agent sends only (handle, origin) over a unix socket and receives a fill count. Per-op SO_PEERCRED checks give the gateway uid status/list/fill only, and every tab websocket is matched against the pinned endpoint before anything is written. Linux; stdlib unittest suite; deps cryptography + websockets."
author: Karasumikura
kind: standalone
platforms:
  - linux
provides_tools:
  - vault_broker_status
  - vault_broker_list
  - vault_broker_fill
provides_hooks: []
